<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Teste de estilos · Corredor Invertido</title>
  <meta name="description" content="Protótipo de técnica visual: 3D simples retrô ou papel 2.5D, com formas neutras.">
  <link rel="icon" href="../../icons/icon-192.png" type="image/png">
  <style>
    html, body { height: 100%; margin: 0; background: #b9d3df; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; font: 600 13px/1.3 system-ui, sans-serif; }
    #stage { position: fixed; top: 0; bottom: 0; left: 0; right: 0; margin-inline: auto; width: min(100vw, calc(100dvh * 9 / 16)); }
    #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; transform: scaleX(-1); }
    .bar { position: absolute; left: 0; right: 0; top: 0; display: flex; gap: 8px; justify-content: center; align-items: center; padding: 12px; flex-wrap: wrap; }
    button { font: inherit; padding: 9px 14px; border-radius: 999px; border: 2px solid #1d2a33; background: rgba(255,255,255,.85); color: #1d2a33; cursor: pointer; }
    button[aria-pressed="true"] { background: #1d2a33; color: #fff; }
    #dist { position: absolute; top: 58px; left: 0; right: 0; text-align: center; color: #fff; font-size: 22px; text-shadow: 0 1px 6px rgba(0,0,0,.6); pointer-events: none; }
    .help { position: absolute; bottom: 12px; left: 12px; right: 12px; text-align: center; color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,.7); pointer-events: none; font-weight: 500; }
  </style>
</head>
<body>
<div id="stage">
  <canvas id="game" aria-label="Teste de estilo visual"></canvas>
  <div class="bar">
    <button type="button" data-estilo="retro">A · 3D retrô</button>
    <button type="button" data-estilo="papel">B · Papel 2.5D</button>
  </div>
  <div id="dist">0 m</div>
  <p class="help">Só a técnica, com formas neutras: a arte final substitui tudo. Toque para pular, toque de novo ou arraste para cima para inverter, arraste para baixo para deslizar.</p>
</div>
<script type="module" src="proto.js"></script>
</body>
</html>
